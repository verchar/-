# YOLOv8s with C2f-DCNv2 (可变形卷积)
# 适用于：解决自然农田场景下，杂草与玉米叶片严重交叠遮挡的问题
# 优势：在Neck端引入可变形感受野，兼顾训练速度与边缘提取精度

nc: 9  # 类别数量
scales: 
  s: [0.33, 0.50, 1024]  # 使用 YOLOv8s 的缩放比例

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]   # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]    # 9 (去掉了之前的CBAM，恢复标准序号)

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]  # 11 cat backbone P4
  - [-1, 3, C2f_DCNv2, [512]]  # 12 <--- 【创新点1】替换为可变形卷积模块

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]  # 14 cat backbone P3
  - [-1, 3, C2f_DCNv2, [256]]  # 15 <--- 【创新点2】替换为可变形卷积模块 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 16
  - [[-1, 12], 1, Concat, [1]] # 17 cat head P4
  - [-1, 3, C2f_DCNv2, [512]]  # 18 <--- 【创新点3】替换为可变形卷积模块 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 19
  - [[-1, 9], 1, Concat, [1]]  # 20 cat head P5 (注意：连接回SPPF层)
  - [-1, 3, C2f_DCNv2, [1024]] # 21 <--- 【创新点4】替换为可变形卷积模块 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]  # 22 Detect(P3, P4, P5)